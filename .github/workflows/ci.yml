name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Migrations and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major versions as Supabase: Postgres 16 with PostGIS 3.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gigmap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gigmap_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gigmap_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create shadow database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE gigmap_shadow'
      # schema.prisma and the hand-written migrations must describe the same
      # database, or the next `prisma migrate dev` generates destructive SQL.
      - name: Check Prisma schema matches migrations
        run: pnpm --filter @gigmap/api prisma:check-drift
      - run: pnpm test:e2e
