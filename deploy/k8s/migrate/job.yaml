apiVersion: batch/v1
kind: Job
metadata:
  name: gigmap-api-migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: gigmap-api
          command:
            - node_modules/.bin/prisma
            - migrate
            - deploy
            - --schema
            - apps/api/prisma/schema.prisma
          env:
            # The Prisma CLI writes caches under $HOME; keep them on the
            # writable scratch volume and skip its update check.
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: '1'
          envFrom:
            # Needs DATABASE_URL and DIRECT_URL (session-mode connection).
            - secretRef:
                name: gigmap-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
