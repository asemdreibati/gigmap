apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gigmap-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gigmap-api
  minReplicas: 2
  # Keep maxReplicas x connection_limit (in DATABASE_URL) under the
  # Supabase pooler's client limit. See docs/deployment.md.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
