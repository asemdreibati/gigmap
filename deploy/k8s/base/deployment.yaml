apiVersion: apps/v1
kind: Deployment
metadata:
  name: gigmap-api
spec:
  # No `replicas`: the HPA owns the count, and a fixed value here would reset
  # it on every apply.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      # Drain (10 s) + longest request + push flush (5 s), with headroom.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in the image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gigmap-api
      containers:
        - name: api
          image: gigmap-api
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: gigmap-api-config
            # DATABASE_URL, optional REDIS_URL, SUPABASE_JWT_SECRET,
            # RESEND_API_KEY, ADMIN_EMAIL, EXPO_ACCESS_TOKEN. See README.md.
            - secretRef:
                name: gigmap-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never touches the database: an outage there must not
          # restart every pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness fails when the database is unreachable and while the
          # pod drains on shutdown.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
